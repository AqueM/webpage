<div id="side-image"><img src="/assets/images/layout/canva-vines1.webp" alt="menu vines"></div>
<nav class="fancy-border">
	<div class="corner top left"></div>
	<div class="corner top right"></div>
	<div class="corner bottom left"></div>
	<div class="corner bottom right"></div>
	<div class="navigation">
		<div class="menu" id="menu">
			<ul class="menu-list">
				<li><a  class="menu-item{% if page.url=='/' %} active{% endif %}" href="/">Home</a></li>
			</ul>
			{%- for category in categories -%}
			<h4 class="menu-label"><span class="icon"><i
						class="{{category.icon}}"></i></span><span>{{category.name}}</span>
			</h4>
			<ul class="menu-list">
				{%- for element in collections[category.name] -%}
				<li><a class="menu-item{% if element.url==page.url %} active{% endif %}"
						href="{{element.url}}">{{element.data.displayName}}</a></li>
				{%- endfor %}
			</ul>
			{%- endfor %}
		</div>
	</div>
</nav>
