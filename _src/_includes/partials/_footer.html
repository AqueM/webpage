<footer class="layout__footer">
	<div class="layout__image layout__image__footer" style="--layout-img: '/assets/images/layout/canva-flowers.webp';">
	</div>
	<div class="theme__border-card theme__block--secondrary">
		{% include "partials/_decor-corners.html" %}
		<div class="footer layout__flex-block__row">
			<div class="layout__flex-block__row">
				<div class="design__border-block">
					{% include "partials/_decor-sides.html" %}
					© {{ "now" | date: "%Y" }} Aque
				</div>
				<div class="theme--no-break"><span>visitors so far: </span>
					<div class="external-code"><script type="text/javascript" src="https://counter.websiteout.com/js/30/0/0/1"></script></div>
				</div>
				<a href="http://www.snazzyspace.com/generators/viewer-counter/" title="SnazzySpace.com Viewer Counter"
					target="_blank" rel="external nofollow" class="noformat"><img
						src="http://www.snazzyspace.com/generators/viewer-counter/counter.php/fid=1784368936/style=0/counter.png"
						border="0"></a>
			</div>
			<div class="layout__flex-block__row">
				<a href="https://nekoweb.org/" target="_blank" rel="external">
					<img class="noformat animated" src="/assets/images/layout/nekoweb.webp"
						alt="Nekoweb button">
				</a>
				<a class="footer-badges" href="https://neocities.org/" target="_blank" rel="external">
					<img src="/assets/images/layout/neocities-button_88x31.webp" alt="Neocities button"
						class="noformat">
				</a>
				<a href="https://notbyai.fyi" target="_blank" rel="external"><img
						src="/assets/images/layout/Created-By-a-Human-Not-By-AI-Badge-white.png"
						alt="'Created by a human not by AI' badge" class="noformat"></a>
			</div>
		</div>
	</div>
</footer>
