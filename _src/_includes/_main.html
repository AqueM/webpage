<!doctype html>
<html lang="en">

<head>
    <style>
        html{visibility: hidden;opacity:0;}
    </style>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="{{site.description}}">
    <meta name="robots" content="noai, noimageai">
    <title>{{title}}</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <link rel="icon" type="image/x-icon" href="/assets/images/layout/favicon.ico" />
    <link rel="stylesheet" href="/assets/photoswipe/photoswipe.css" />
    <link rel="stylesheet"
        href="https://unpkg.com/photoswipe-dynamic-caption-plugin/photoswipe-dynamic-caption-plugin.css">
    <script defer src="/assets/javascript/accessibility.js"></script>
</head>

<body>
    <div id="page">
        {% include "_header.html" %}
        <!-- viewport -->
        <div id="page-contents">

            {% include "_nav.html" %}

            <!-- main content -->
            <main id="main-bg" class="fancy-border">
                <div class="corner top left"></div>
                <div class="corner top right"></div>
                <div class="corner bottom left"></div>
                <div class="corner bottom right"></div>

                {{content}}

            </main>
            <!-- main content end -->

        </div>
        {% include "_footer.html" %}
    </div>
</body>

</html>
