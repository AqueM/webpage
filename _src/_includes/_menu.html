<div class="sidebar menu">
    {%- for category in nav.categories -%}
    <details class="noformat{% if pageTags == category.name %} open{% endif %}" {% if pageTags==category.name %} open{%
        endif %}>
        <summary class="noformat">
            <div class="menu-label{% if pageTags == category.name %} open-category{% endif %}"><span class="icon" style="background-image: url('/assets/images/layout/font-awesome/{{category.icon}}.svg');"></span><span class="category-name">{{category.name}}</span>
            </div>
        </summary>
        <ul class="noformat menu-list">
            {%- assign links = collections[category.name] | order -%}
            {%- for element in links -%}
            <li><a class="menu-item{% if element.url==page.url %} active-link{% endif %}"
                    href="{% if element.url %}{{ element.url }}{% else %}{{ element.data.link }}{% endif %}"
                    target="{{element.data.target}}">{{element.data.displayName}}</a></li>
            {%- endfor %}
        </ul>
    </details>
    {%- endfor %}
</div>
